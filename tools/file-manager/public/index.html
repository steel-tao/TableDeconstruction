<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obsidian 文件管理器 | 打开到 Doocs</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 1px;
      width: 100%;
      max-width: 1800px;
      height: 90vh;
      background: #e0e0e0;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    /* 侧边栏 */
    .sidebar {
      background: #f8f9fa;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid #e0e0e0;
      background: white;
    }

    .sidebar-title {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
    }

    .sidebar-subtitle {
      font-size: 12px;
      color: #999;
    }

    .file-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .series-group {
      margin-bottom: 15px;
    }

    .series-name {
      font-size: 12px;
      font-weight: 600;
      color: #667eea;
      text-transform: uppercase;
      padding: 8px 10px;
      cursor: pointer;
      background: #f0f0f0;
      border-radius: 4px;
      margin-bottom: 5px;
    }

    .file-item {
      padding: 10px 12px;
      margin: 3px 0;
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 13px;
      color: #333;
    }

    .file-item:hover {
      background: #e3f2fd;
      border-color: #667eea;
      transform: translateX(4px);
    }

    .file-item.active {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    .file-name {
      font-weight: 500;
      margin-bottom: 3px;
    }

    .file-meta {
      font-size: 11px;
      opacity: 0.7;
    }

    /* 主编辑区 */
    .main {
      display: flex;
      flex-direction: column;
      background: white;
      position: relative;
    }
      outline: none;
      resize: none;
    }

    .no-file {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 16px;
    }

    .loading {
      text-align: center;
      color: #667eea;
      font-size: 14px;
    }

    .success {
      background: #4caf50;
      color: white;
      padding: 10px 15px;
      border-radius: 4px;
      margin-bottom: 10px;
      font-size: 13px;
    }

    .error {
      background: #f44336;
      color: white;
      padding: 10px 15px;
      border-radius: 4px;
      margin-bottom: 10px;
      font-size: 13px;
    }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
        height: auto;
      }

      .sidebar {
        max-height: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 侧边栏 -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">📁 Obsidian 文件</div>
        <div class="sidebar-subtitle">点击打开文件</div>
      </div>
      <div class="file-list" id="fileList">
        <div class="loading">加载中...</div>
      </div>
    </div>

    <!-- 主编辑区 - 完全由Doocs iframe替代 -->
    <div class="main">
      <iframe id="doocsFrame" src="http://127.0.0.1:8800" style="width:100%; height:100%; border:none; display:none;"></iframe>
      <div id="doocsLoading" style="display:flex; align-items:center; justify-content:center; width:100%; height:100%; font-size:16px; color:#667eea;">
        📂 请从左侧选择文件开始编辑
      </div>
    </div>
  </div>

  <script>
    const VAULT_API = 'http://127.0.0.1:3000/api';
    const DOOCS_URL = 'http://127.0.0.1:8800';

    let currentFile = null;
    let currentContent = '';
    let pendingImportId = null;      // 🆕 记录待处理的导入ID
    let reloadInProgress = false;    // 🆕 记录 iframe reload 是否正在进行中

    // 加载文件列表
    async function loadFiles() {
      try {
        const response = await fetch(`${VAULT_API}/files`);
        const data = await response.json();
        renderFileList(data.files);
      } catch (error) {
        document.getElementById('fileList').innerHTML = `<div class="error">❌ 加载失败: ${error.message}</div>`;
      }
    }

    // 渲染文件列表
    function renderFileList(files) {
      const fileList = document.getElementById('fileList');
      fileList.innerHTML = '';

      // 按系列分组
      const grouped = {};
      files.forEach(file => {
        const series = file.series || '(无系列)';
        if (!grouped[series]) {
          grouped[series] = [];
        }
        grouped[series].push(file);
      });

      // 渲染每个系列
      Object.entries(grouped).forEach(([series, seriesFiles]) => {
        const groupDiv = document.createElement('div');
        groupDiv.className = 'series-group';

        const seriesTitle = document.createElement('div');
        seriesTitle.className = 'series-name';
        seriesTitle.textContent = `📚 ${series} (${seriesFiles.length})`;
        groupDiv.appendChild(seriesTitle);

        seriesFiles.forEach(file => {
          const fileDiv = document.createElement('div');
          fileDiv.className = 'file-item';
          fileDiv.innerHTML = `
            <div class="file-name">${file.filename}</div>
            <div class="file-meta">${file.wordCount} 字</div>
          `;
          // 🔧 显式传递文件对象和点击元素，不依赖隐式全局 event
          fileDiv.onclick = (evt) => openFile(file, fileDiv, evt);
          groupDiv.appendChild(fileDiv);
        });

        fileList.appendChild(groupDiv);
      });
    }

    // 打开文件 - 在iframe中加载Doocs编辑器
    // 🔧 改为显式接收点击元素参数，不依赖隐式全局 event
    async function openFile(file, clickedElement, evt) {
      try {
        // 更新UI - 高亮选中的文件
        document.getElementById('fileList').querySelectorAll('.file-item').forEach(el => {
          el.classList.remove('active');
        });
        // 🔧 安全判空并高亮实际点击的元素
        if (clickedElement && typeof clickedElement.classList !== 'undefined') {
          clickedElement.classList.add('active');
        }

        // 获取文件内容
        const response = await fetch(`${VAULT_API}/file/${encodeURIComponent(file.filename)}`);
        const data = await response.json();

        currentFile = data;
        currentContent = data.content;

        // 显示Doocs iframe
        showDoocsEditor();
        
        // 通知iframe加载这个文件（通过postMessage）
        setTimeout(() => {
          notifyDoocsFrameNewFile(file.filename, currentContent);
        }, 500);
        
      } catch (error) {
        document.getElementById('doocsLoading').innerHTML = `<div style="color:#f44336; text-align:center;">❌ 打开文件失败: ${error.message}</div>`;
      }
    }

    // 显示Doocs编辑器iframe
    function showDoocsEditor() {
      const doocsFrame = document.getElementById('doocsFrame');
      const doocsLoading = document.getElementById('doocsLoading');
      
      // 显示iframe，隐藏loading提示
      doocsFrame.style.display = 'block';
      doocsLoading.style.display = 'none';
    }

    // 🔧 通过后端暂存通知 iframe 新文件信息（完全改造版）
    async function notifyDoocsFrameNewFile(filename, markdownContent) {
      try {
        console.log('[Obsidian] 发送导入请求，文件:', filename);
        
        // 🆕 调用 3000 后端的导入接口暂存内容
        const response = await fetch(`${VAULT_API}/doocs/import`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            content: markdownContent, 
            filename: filename
          })
        });
        
        if (!response.ok) {
          throw new Error('HTTP ' + response.status);
        }
        
        const result = await response.json();
        const newImportId = result.importId;
        
        console.log('[Obsidian] 新导入ID:', newImportId);
        
        // 🆕 如果当前有 reload 在进行中，记录新的 importId，让它加载最新版本
        if (reloadInProgress) {
          console.log('[Obsidian] 当前有 reload 进行中，更新待刷新 importId 为:', newImportId);
          pendingImportId = newImportId;
          return;
        }
        
        // 🆕 执行 reload
        reloadInProgress = true;
        pendingImportId = newImportId;
        
        const iframe = document.getElementById('doocsFrame');
        
        // 🆕 完整的一次性监听器处理：自动移除、防重复、处理递归 reload
        const onloadHandler = function() {
          console.log('[Obsidian] iframe 已重新加载');
          // 🆕 立即清理监听器，防止重复触发
          iframe.onload = null;
          reloadInProgress = false;
          
          // 🆕 如果在 reload 过程中有新请求到达，递归地再刷一次
          if (pendingImportId !== newImportId) {
            console.log('[Obsidian] 检测到更新的 importId，准备递归重新加载');
            const newPendingId = pendingImportId;
            // 🆕 触发新的 reload（确保清理旧 reload 参数再拼接新参数）
            const baseSrc = iframe.src.split('?')[0];
            iframe.src = baseSrc + '?reload=' + Date.now();
            pendingImportId = newPendingId;
            reloadInProgress = true;
            iframe.onload = onloadHandler;
          }
        };
        iframe.onload = onloadHandler;
        
        // 🆕 触发初始 reload（清理旧 reload 参数再拼接新参数）
        const baseSrc = iframe.src.split('?')[0];
        iframe.src = baseSrc + '?reload=' + Date.now();
        
        console.log('[Obsidian] ✅ iframe 已触发刷新，importId:', newImportId);
        
      } catch (error) {
        console.error('[Obsidian] ❌ 导入失败:', error);
        reloadInProgress = false;
        document.getElementById('doocsLoading').innerHTML = `<div style="color:#f44336; text-align:center;">❌ 导入失败: ${error.message}<br/>请尝试手动复制内容到 Doocs</div>`;
      }
    }

    // 监听来自iframe的postMessage（获取编辑内容）
    window.addEventListener('message', (event) => {
      // 只接受来自同源的消息
      if (event.origin !== 'http://127.0.0.1:8800') {
        return;
      }

      console.log('[IFRAME-MSG] 收到消息:', event.data);

      if (event.data.type === 'GET_MARKDOWN') {
        // Doocs请求获取当前markdown
        currentContent = event.data.markdown;
        console.log('[IFRAME-MSG] 更新了当前内容长度:', currentContent.length);
      }
    });

    // 显示消息提示
    function showMessage(message, type) {
      const messageDiv = document.createElement('div');
      messageDiv.className = type;
      messageDiv.textContent = message;
      messageDiv.style.position = 'fixed';
      messageDiv.style.top = '20px';
      messageDiv.style.right = '20px';
      messageDiv.style.zIndex = '9999';
      messageDiv.style.minWidth = '300px';
      messageDiv.style.textAlign = 'center';
      
      document.body.appendChild(messageDiv);
      setTimeout(() => messageDiv.remove(), 3000);
    }

    // 初始化
    loadFiles();
  </script>
</body>
</html>
